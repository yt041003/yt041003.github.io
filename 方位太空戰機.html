<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方位太空戰機 (Bearings Shooter)</title>
    <style>
        /* 復古像素風格設定 */
        body {
            background-color: #111;
            color: #0f0; /* 螢光綠 */
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 450px;
            margin: 0 auto;
            background-color: #000;
            border: 4px solid #0f0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }
        canvas {
            background-color: #001100;
            border: 1px solid #333;
            border-radius: 4px;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .text-red { color: #ff3333; }
        .text-cyan { color: #00ffff; }
        .text-yellow { color: #ffff00; }
        
        #controls { margin-top: 15px; }
        #question { font-size: 18px; margin-bottom: 10px; font-weight: bold; }
        
        input {
            background-color: #222;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 10px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            width: 150px;
            text-align: center;
            outline: none;
        }
        input:focus { border-color: #00ffff; box-shadow: 0 0 10px #00ffff; }
        
        button {
            background-color: #0f0;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            margin-left: 10px;
            transition: 0.2s;
        }
        button:hover { background-color: #fff; }
        
        /* 覆蓋層 (開始畫面與結束畫面) */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { color: #0f0; text-shadow: 2px 2px #005500; font-size: 32px; }
        p { line-height: 1.5; font-size: 16px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <span id="round-display">Round: 1/10</span>
        <span id="lives-display" class="text-red">♥♥♥</span>
        <span id="timer-display" class="text-cyan">Time: 20s</span>
        <span id="score-display">Score: 0</span>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="start-screen" class="overlay">
            <h1>方位太空戰機</h1>
            <p>輸入正確的方位角來擊毀目標！<br><br>支援 <span class="text-cyan">True Bearing</span> (例: 045)<br>與 <span class="text-yellow">Compass Bearing</span> (例: N45E)</p>
            <button onclick="startGame()">START GAME</button>
        </div>
        
        <div id="game-over-screen" class="overlay hidden">
            <h1 id="game-over-title">GAME OVER</h1>
            <p id="final-stats">Score: 0</p>
            <button onclick="startGame()">PLAY AGAIN</button>
        </div>
    </div>

    <div id="controls">
        <div id="question" class="text-yellow">等待目標出現...</div>
        <div>
            <input type="text" id="answer-input" placeholder="例如: 045 或 N45E" autocomplete="off" onkeydown="if(event.key === 'Enter') checkAnswer()">
            <button onclick="checkAnswer()">ATTACK</button>
        </div>
    </div>
</div>

<script>
    // --- 遊戲全域變數 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radarRadius = 140;

    let currentAngle = 0;       // 真方位角 (0-359)
    let acuteAngle = 0;         // 與 N/S 的銳角夾角
    let nsLabel = '', ewLabel = '';
    let currentType = '';       // 'true' 或 'compass'
    let correctAnswer = '';     
    
    let round = 1;
    let lives = 3;
    let score = 0;
    let timeLeft = 20;
    let timerInterval = null;
    let isGameOver = true;
    let showLaser = false;

    // --- 遊戲流程控制 ---
    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        round = 1;
        lives = 3;
        score = 0;
        isGameOver = false;
        nextRound();
    }

    function nextRound() {
        if (lives <= 0 || round > 10) {
            endGame();
            return;
        }
        timeLeft = 20;
        showLaser = false;
        updateHUD();
        generateQuestion();
        drawScene();
        
        // 重置並啟動計時器
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateHUD();
            if (timeLeft <= 0) {
                handleWrongAnswer("Time's Up!");
            }
        }, 1000);
        
        // 自動聚焦輸入框
        const inputField = document.getElementById('answer-input');
        inputField.value = '';
        inputField.focus();
    }

    function endGame() {
        isGameOver = true;
        clearInterval(timerInterval);
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('game-over-title').innerText = lives > 0 ? "MISSION ACCOMPLISHED" : "MISSION FAILED";
        document.getElementById('game-over-title').className = lives > 0 ? "text-cyan" : "text-red";
        document.getElementById('final-stats').innerHTML = `Final Score: ${score}<br>Lives left: ${lives}`;
    }

    // --- 題目生成邏輯 ---
    function generateQuestion() {
        // 為了教學清晰，隨機生成 5 到 85 度的銳角 (避免 0, 90 的座標軸模糊地帶)
        acuteAngle = (Math.floor(Math.random() * 17) + 1) * 5; 
        let quadrant = Math.floor(Math.random() * 4); // 0:NE, 1:SE, 2:SW, 3:NW

        if (quadrant === 0) { currentAngle = acuteAngle; nsLabel = 'N'; ewLabel = 'E'; }
        if (quadrant === 1) { currentAngle = 180 - acuteAngle; nsLabel = 'S'; ewLabel = 'E'; }
        if (quadrant === 2) { currentAngle = 180 + acuteAngle; nsLabel = 'S'; ewLabel = 'W'; }
        if (quadrant === 3) { currentAngle = 360 - acuteAngle; nsLabel = 'N'; ewLabel = 'W'; }

        // 隨機選擇題型
        currentType = Math.random() < 0.5 ? 'true' : 'compass';
        const qElement = document.getElementById('question');

        if (currentType === 'true') {
            qElement.innerHTML = `目標發現！請輸入 <span class="text-cyan">True Bearing</span> (3位數):`;
            correctAnswer = currentAngle.toString().padStart(3, '0');
        } else {
            qElement.innerHTML = `目標發現！請輸入 <span class="text-yellow">Compass Bearing</span>:`;
            correctAnswer = `${nsLabel}${acuteAngle}${ewLabel}`;
        }
    }

    // --- 答案判定 ---
    function checkAnswer() {
        if (isGameOver || showLaser) return;
        
        let input = document.getElementById('answer-input').value;
        // 防呆：去除所有空白字元、轉大寫、移除度數符號
        input = input.replace(/\s+/g, '').toUpperCase().replace(/°/g, '');

        let isCorrect = false;
        if (currentType === 'true') {
            // 允許輸入 "045" 或 "45"
            if (parseInt(input, 10) === currentAngle) isCorrect = true;
        } else {
            if (input === correctAnswer) isCorrect = true;
        }

        if (isCorrect) {
            handleCorrectAnswer();
        } else {
            handleWrongAnswer(`錯誤！正確答案為: ${correctAnswer}`);
        }
    }

    function handleCorrectAnswer() {
        clearInterval(timerInterval);
        score += 100 * timeLeft; // 剩餘時間越多分數越高
        showLaser = true;
        drawScene(); // 畫出雷射
        
        setTimeout(() => {
            round++;
            nextRound();
        }, 1000); // 停頓 1 秒讓玩家看動畫
    }

    function handleWrongAnswer(msg) {
        clearInterval(timerInterval);
        lives--;
        updateHUD();
        
        // 畫面閃紅
        ctx.fillStyle = "rgba(255, 0, 0, 0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        alert(msg); // 簡單的警告視窗提示正確答案
        
        round++;
        nextRound();
    }

    // --- 繪圖邏輯 ---
    function updateHUD() {
        document.getElementById('round-display').innerText = `Round: ${round}/10`;
        document.getElementById('lives-display').innerText = '♥'.repeat(Math.max(0, lives));
        document.getElementById('timer-display').innerText = `Time: ${timeLeft}s`;
        document.getElementById('score-display').innerText = `Score: ${score}`;
    }

    function drawScene() {
        // 清除畫布
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 畫十字座標軸與 N,E,S,W
        ctx.strokeStyle = '#004400';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, 10); ctx.lineTo(cx, canvas.height - 10);
        ctx.moveTo(10, cy); ctx.lineTo(canvas.width - 10, cy);
        ctx.stroke();

        ctx.fillStyle = '#0f0';
        ctx.font = '16px Courier New';
        ctx.fillText('N', cx - 5, 20);
        ctx.fillText('S', cx - 5, canvas.height - 10);
        ctx.fillText('E', canvas.width - 20, cy + 5);
        ctx.fillText('W', 10, cy + 5);

        // 將 Bearing (正北為 0，順時針) 轉換為 Canvas 弧度 (正右為 0，順時針)
        let mathAngle = currentAngle - 90; 
        let rad = mathAngle * Math.PI / 180;
        let targetX = cx + radarRadius * Math.cos(rad);
        let targetY = cy + radarRadius * Math.sin(rad);

        // 畫虛線提示
        ctx.strokeStyle = '#555';
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(targetX, targetY);
        ctx.stroke();
        ctx.setLineDash([]); // 恢復實線

        // 畫輔助角度弧線與文字
        ctx.strokeStyle = '#ffff00';
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        let startArc = (nsLabel === 'N') ? -Math.PI/2 : Math.PI/2;
        // 判斷弧線畫的方向 (順時針或逆時針)
        if (ewLabel === 'E') {
            ctx.arc(cx, cy, 40, startArc, rad, false);
        } else {
            ctx.arc(cx, cy, 40, rad, startArc, false);
        }
        ctx.stroke();
        
        // 標示銳角角度
        let textRad = startArc + (rad - startArc) / 2;
        let textX = cx + 55 * Math.cos(textRad);
        let textY = cy + 55 * Math.sin(textRad);
        ctx.fillText(`${acuteAngle}°`, textX - 10, textY + 5);

        // 如果答對了，畫雷射光與爆炸
        if (showLaser) {
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(targetX, targetY);
            ctx.stroke();

            // 爆炸效果
            ctx.fillStyle = '#ff0';
            ctx.beginPath(); ctx.arc(targetX, targetY, 20, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#f00';
            ctx.beginPath(); ctx.arc(targetX, targetY, 10, 0, Math.PI*2); ctx.fill();
        } else {
            // 畫外星飛船 (紅色方塊)
            ctx.fillStyle = '#f00';
            ctx.fillRect(targetX - 8, targetY - 8, 16, 16);
        }

        // 畫玩家戰機 (中央三角形)
        ctx.fillStyle = '#0f0';
        ctx.beginPath();
        ctx.moveTo(cx, cy - 15);     // 頂點朝北
        ctx.lineTo(cx - 10, cy + 10);
        ctx.lineTo(cx + 10, cy + 10);
        ctx.closePath();
        ctx.fill();
    }
</script>
</body>
</html>
